name: NovaMente Segurança - Segredos e Dependências

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

# Só leitura do repositório: nenhum passo precisa gravar nada.
permissions:
  contents: read

jobs:
  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Código (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # O binário oficial roda em container, com versão fixa. Não usamos a
      # gitleaks-action, que exige licença em repositórios de organização.
      # --redact esconde o valor do segredo no log; o código de saída 1 reprova o job.
      # .gitleaks.toml libera só os valores fictícios de exemplos e testes.
      # GIT_CONFIG_*: o git do container precisa confiar na pasta montada.
      - name: Varrer o histórico com o gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose --no-banner

  auditoria-backend:
    name: Auditoria de dependências do backend (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informativo: achados aparecem como aviso e não reprovam o pipeline.
    continue-on-error: true

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar o pip-audit
        run: python -m pip install pip-audit

      - name: Auditar requirements.txt
        continue-on-error: true
        run: |
          set -o pipefail
          pip-audit -r backend/requirements.txt --progress-spinner off --format markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

  auditoria-frontend:
    name: Auditoria de dependências do frontend (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informativo: achados aparecem como aviso e não reprovam o pipeline.
    continue-on-error: true
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Auditar package-lock.json
        continue-on-error: true
        run: |
          set -o pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tail -n 60
